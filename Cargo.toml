[package]
name = "cashflow"
version = "0.1.1"
edition = "2024"
license = "MIT"
authors = ["Sauli Anto"]
repository = "https://github.com/isaul32/cashflow"
description = "Monthly income and expense tracker with a Sankey flow chart"

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
gpui-kit = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
